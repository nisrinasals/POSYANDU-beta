openapi: 3.0.3
info:
  title: POSYANDU API
  version: 1.0.0
  description: REST API untuk pengelolaan data Posyandu ILP.
servers:
  - url: http://localhost:3000/api
    description: Local development

tags:
  - name: Auth
  - name: Posyandu
  - name: Warga
  - name: Imunisasi
  - name: Sesi Posyandu
  - name: Users
  - name: Kehamilan
  - name: Kunjungan
  - name: Pemeriksaan
  - name: Rujukan

paths:
  /health:
    servers:
      - url: http://localhost:3000
        description: Server root for health check
    get:
      tags: [Auth]
      summary: Health check
      description: Public server health check outside the /api router.
      security: []
      responses:
        "200":
          description: API aktif
          content:
            application/json:
              schema:
                type: object
                required: [success, message]
                properties:
                  success: { type: boolean, example: true }
                  message: { type: string, example: API Posyandu aktif. }
  /auth/register:
    post:
      tags: [Auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterRequest" } } }
      responses: { "201": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify OTP
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/VerifyOtpRequest" } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend OTP
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResendOtpRequest" } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" }, "429": { $ref: "#/components/responses/Error" } }
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/LoginRequest" } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" }, "401": { $ref: "#/components/responses/Unauthorized" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /auth/request-reset-password:
    post:
      tags: [Auth]
      summary: Request password reset OTP
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/EmailRequest" } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ResetPasswordRequest" } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" }, "404": { $ref: "#/components/responses/NotFound" } }
  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      security: [{ bearerAuth: [] }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "401": { $ref: "#/components/responses/Unauthorized" } }

  /posyandu:
    get:
      tags: [Posyandu]
      summary: List Posyandu
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" }, "401": { $ref: "#/components/responses/Unauthorized" } }
  /posyandu/{id}:
    get:
      tags: [Posyandu]
      summary: Get Posyandu
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }

  /warga:
    get:
      tags: [Warga]
      summary: List Warga
      description: Personal-data endpoint. Dinkes and DinkesAdmin are denied by backend middleware.
      parameters:
        [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Category" }, { $ref: "#/components/parameters/StatusDomisili" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" }, "400": { $ref: "#/components/responses/ValidationError" } }
    post:
      tags: [Warga]
      summary: Create Warga
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WargaRequest" } } } }
      responses: { "201": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" }, "409": { $ref: "#/components/responses/Error" } }
  /warga/export:
    get:
      tags: [Warga]
      summary: Export Data Sasaran as Excel
      description: Export scoped Warga using the Sasaran form mapping.
      parameters: [{ $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/Category" }, { $ref: "#/components/parameters/StatusDomisili" }, { $ref: "#/components/parameters/PosyanduId" }]
      responses: { "200": { $ref: "#/components/responses/Xlsx" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /warga/statistik-sasaran:
    get:
      tags: [Warga]
      summary: Get target statistics
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /warga/{id}:
    get:
      tags: [Warga]
      summary: Get Warga
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Warga]
      summary: Update Warga
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WargaRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /warga/{id}/status-domisili:
    patch:
      tags: [Warga]
      summary: Update domicile status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [status_domisili], properties: { status_domisili: { type: string, enum: [aktif, pindah, meninggal] } } } } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /warga/mutasi/verify:
    post:
      tags: [Warga]
      summary: Verify Warga mutation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExaminationRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Forbidden" } }
  /warga/mutasi/confirm:
    patch:
      tags: [Warga]
      summary: Confirm Warga mutation
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExaminationRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "403": { $ref: "#/components/responses/Forbidden" } }

  /imunisasi/warga/{warga_id}:
    get:
      tags: [Imunisasi]
      summary: List immunizations by Warga
      parameters: [{ $ref: "#/components/parameters/WargaId" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }
  /imunisasi/{id}:
    get:
      tags: [Imunisasi]
      summary: Get immunization
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Imunisasi]
      summary: Update immunization
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step2Request" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /imunisasi:
    post:
      tags: [Imunisasi]
      summary: Create immunization
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step4Request" } } } }
      responses: { "201": { $ref: "#/components/responses/Success" } }

  /sesi-posyandu:
    get:
      tags: [Sesi Posyandu]
      summary: List sessions
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
    post:
      tags: [Sesi Posyandu]
      summary: Create session
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step5Request" } } } }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /sesi-posyandu/{id}:
    get:
      tags: [Sesi Posyandu]
      summary: Get session
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
    put:
      tags: [Sesi Posyandu]
      summary: Update session
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /sesi-posyandu/{id}/status:
    patch:
      tags: [Sesi Posyandu]
      summary: Update session status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /users/me:
    get:
      tags: [Users]
      summary: Get current user
      responses: { "200": { $ref: "#/components/responses/Success" } }
    patch:
      tags: [Users]
      summary: Update current user
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/me/profile-picture:
    post:
      tags: [Users]
      summary: Upload profile picture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object, required: [profile_picture], properties: { profile_picture: { type: string, format: binary } } }
      responses: { "200": { $ref: "#/components/responses/Success" }, "413": { $ref: "#/components/responses/Error" } }
  /users:
    get:
      tags: [Users]
      summary: List users
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
  /users/{id}:
    get:
      tags: [Users]
      summary: Get user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/verify:
    patch:
      tags: [Users]
      summary: Verify user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/deactivate:
    patch:
      tags: [Users]
      summary: Deactivate user
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/puskesmas-admin:
    put:
      tags: [Users]
      summary: Replace Puskesmas admin
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/dinkes-admin:
    put:
      tags: [Users]
      summary: Replace Dinkes admin
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/role:
    patch:
      tags: [Users]
      summary: Change user role
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /users/{id}/status:
    patch:
      tags: [Users]
      summary: Change user status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /kehamilan/warga/{warga_id}:
    get:
      tags: [Kehamilan]
      summary: List pregnancy profiles
      parameters: [{ $ref: "#/components/parameters/WargaId" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /kehamilan/{id}:
    get:
      tags: [Kehamilan]
      summary: Get pregnancy profile
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }
    put:
      tags: [Kehamilan]
      summary: Update pregnancy profile
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /kehamilan:
    post:
      tags: [Kehamilan]
      summary: Create pregnancy profile
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /kehamilan/{id}/status:
    patch:
      tags: [Kehamilan]
      summary: Update pregnancy status
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /kunjungan:
    post:
      tags: [Kunjungan]
      summary: Create visit
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "201": { $ref: "#/components/responses/Success" } }
    get:
      tags: [Kunjungan]
      summary: List visits
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
  /kunjungan/antrean-hari-ini:
    get:
      tags: [Kunjungan]
      summary: Get today's queue
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /kunjungan/{id}:
    get:
      tags: [Kunjungan]
      summary: Get visit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
    delete:
      tags: [Kunjungan]
      summary: Delete visit
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /kunjungan/{id}/status-langkah:
    patch:
      tags: [Kunjungan]
      summary: Update visit step
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { type: object } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /pemeriksaan:
    get:
      tags: [Pemeriksaan]
      summary: List examinations
      parameters:
        [
          { $ref: "#/components/parameters/Page" },
          { $ref: "#/components/parameters/Limit" },
          { $ref: "#/components/parameters/Search" },
          { $ref: "#/components/parameters/Category" },
          { $ref: "#/components/parameters/StartDate" },
          { $ref: "#/components/parameters/EndDate" },
        ]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
    post:
      tags: [Pemeriksaan]
      summary: Create examination
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExaminationRequest" } } } }
      responses: { "201": { $ref: "#/components/responses/Success" } }
  /pemeriksaan/export:
    get:
      tags: [Pemeriksaan]
      summary: Export Rekap Pemeriksaan as Excel
      description: Recap export. The route is protected by personalAuthenticated and Dinkes/DinkesAdmin cannot access it in the current implementation.
      parameters:
        [
          { $ref: "#/components/parameters/Search" },
          { $ref: "#/components/parameters/Category" },
          { $ref: "#/components/parameters/SessionId" },
          { $ref: "#/components/parameters/PosyanduId" },
          { $ref: "#/components/parameters/StartDate" },
          { $ref: "#/components/parameters/EndDate" },
        ]
      responses: { "200": { $ref: "#/components/responses/Xlsx" }, "400": { $ref: "#/components/responses/ValidationError" } }
  /pemeriksaan/{id}:
    get:
      tags: [Pemeriksaan]
      summary: Get examination
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
    put:
      tags: [Pemeriksaan]
      summary: Update examination
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ExaminationRequest" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
    delete:
      tags: [Pemeriksaan]
      summary: Delete examination
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /pemeriksaan/{id}/step-3:
    get:
      tags: [Pemeriksaan]
      summary: Read Step 3 plotting
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /pemeriksaan/{id}/screening-history:
    get:
      tags: [Pemeriksaan]
      summary: Get screening history
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" }, "404": { $ref: "#/components/responses/NotFound" } }
  /pemeriksaan/step-2:
    post:
      tags: [Pemeriksaan]
      summary: Save Step 2 measurements
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step2Request" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /pemeriksaan/step-4:
    post:
      tags: [Pemeriksaan]
      summary: Save Step 4 screening
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step4Request" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /pemeriksaan/step-5:
    post:
      tags: [Pemeriksaan]
      summary: Save Step 5 education and referral
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/Step5Request" } } } }
      responses: { "200": { $ref: "#/components/responses/Success" } }

  /rujukan:
    get:
      tags: [Rujukan]
      summary: List referrals
      parameters: [{ $ref: "#/components/parameters/Page" }, { $ref: "#/components/parameters/Limit" }, { $ref: "#/components/parameters/Search" }, { $ref: "#/components/parameters/StartDate" }, { $ref: "#/components/parameters/EndDate" }]
      responses: { "200": { $ref: "#/components/responses/Paginated" } }
  /rujukan/{id}:
    get:
      tags: [Rujukan]
      summary: Get referral
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Success" } }
  /rujukan/{id}/export:
    get:
      tags: [Rujukan]
      summary: Export referral PDF
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { $ref: "#/components/responses/Pdf" }, "404": { $ref: "#/components/responses/NotFound" } }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    WargaId: { name: warga_id, in: path, required: true, schema: { type: integer, minimum: 1 } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
    Search: { name: search, in: query, schema: { type: string, maxLength: 100 } }
    Category: { name: kategori_sasaran, in: query, schema: { type: string, enum: [bumil, busui, bayi, balita, apras, uskrem_6_14, uskrem_15_18, dewasa, lansia] } }
    StatusDomisili: { name: status_domisili, in: query, schema: { type: string, enum: [all, aktif, pindah, meninggal] } }
    PosyanduId: { name: posyandu_id, in: query, schema: { type: integer, minimum: 1 } }
    SessionId: { name: sesi_posyandu_id, in: query, schema: { type: integer, minimum: 1 } }
    StartDate: { name: start_date, in: query, schema: { type: string, format: date } }
    EndDate: { name: end_date, in: query, schema: { type: string, format: date } }
  schemas:
    RegisterRequest:
      type: object
      required: [role, email, password, nama_lengkap]
      properties:
        role: { type: string, enum: [kader, puskesmas, dinkes] }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72, format: password }
        nama_lengkap: { type: string, minLength: 2, maxLength: 100 }
        telepon: { type: string, maxLength: 20 }
        nik: { type: string, pattern: "^[0-9]{16}$" }
        puskesmas_id: { type: integer, minimum: 1 }
        posyandu_id: { type: integer, minimum: 1 }
    LoginRequest:
      type: object
      required: [email, password]
      properties: { email: { type: string, format: email }, password: { type: string, format: password } }
    EmailRequest:
      type: object
      required: [email]
      properties: { email: { type: string, format: email } }
    VerifyOtpRequest:
      type: object
      required: [email, otp_code, purpose]
      properties:
        email: { type: string, format: email }
        otp_code: { type: string, pattern: "^[0-9]{6}$" }
        purpose: { type: string, enum: [register, reset_password] }
    ResendOtpRequest:
      type: object
      required: [email, purpose]
      properties:
        email: { type: string, format: email }
        purpose: { type: string, enum: [register, reset_password] }
    ResetPasswordRequest:
      type: object
      required: [email, otp_code, new_password]
      properties:
        email: { type: string, format: email }
        otp_code: { type: string, pattern: "^[0-9]{6}$" }
        new_password: { type: string, minLength: 8, maxLength: 72, format: password }
    MeasurementFields:
      type: object
      properties:
        bb_kg: { type: number, minimum: 0.01, maximum: 999.99 }
        tb_cm: { type: number, minimum: 0.01, maximum: 999.99 }
        lingkar_kepala_cm: { type: number, minimum: 0.01, maximum: 99.99 }
        lila_cm: { type: number, minimum: 0.01, maximum: 99.99 }
        lingkar_perut_cm: { type: number, minimum: 0.01, maximum: 999.99 }
        td_sistole: { type: integer, minimum: 1, maximum: 300 }
        td_diastole: { type: integer, minimum: 1, maximum: 300 }
        kadar_gula: { type: integer, minimum: 0, maximum: 9999 }
    ScreeningFields:
      type: object
      properties:
        detail_skrining: { type: object, additionalProperties: true }
        is_skrining_tahunan: { type: boolean }
        profile_kehamilan_id: { type: integer, minimum: 1, nullable: true }
    ReferralFields:
      type: object
      properties:
        topik_penyuluhan: { type: string, maxLength: 500, nullable: true }
        is_perlu_rujukan: { type: boolean }
        alasan_rujukan: { type: string, maxLength: 1000, nullable: true }
        status_kehadiran_rujukan: { type: string, enum: [hadir, tidak_hadir], nullable: true }
    ExaminationRequest:
      allOf:
        - type: object
          required: [kunjungan_id]
          properties:
            kunjungan_id: { type: integer, minimum: 1 }
            kategori_sasaran: { type: string, enum: [bumil, busui, bayi, balita, apras, uskrem_6_14, uskrem_15_18, dewasa, lansia] }
            tanggal: { type: string, format: date }
        - $ref: "#/components/schemas/MeasurementFields"
        - $ref: "#/components/schemas/ScreeningFields"
        - $ref: "#/components/schemas/ReferralFields"
    Step2Request:
      allOf:
        - type: object
          required: [kunjungan_id]
          properties: { kunjungan_id: { type: integer, minimum: 1 } }
        - $ref: "#/components/schemas/MeasurementFields"
    Step4Request:
      allOf:
        - type: object
          required: [kunjungan_id]
          properties: { kunjungan_id: { type: integer, minimum: 1 } }
        - $ref: "#/components/schemas/ScreeningFields"
    Step5Request:
      allOf:
        - type: object
          required: [kunjungan_id]
          properties: { kunjungan_id: { type: integer, minimum: 1 } }
        - $ref: "#/components/schemas/ReferralFields"
    WargaRequest:
      type: object
      properties:
        nik: { type: string, pattern: "^[0-9]{16}$" }
        nama_lengkap: { type: string }
        jenis_kelamin: { type: string, enum: [L, P] }
        tanggal_lahir: { type: string, format: date }
        alamat: { type: string }
        rt: { type: string }
        rw: { type: string }
        telepon: { type: string }
        status_domisili: { type: string, enum: [aktif, pindah, meninggal] }
    ApiResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        data: {}
    ValidationResponse:
      type: object
      properties:
        status: { type: string, example: error }
        message: { type: string, example: Validasi data gagal }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }
  responses:
    Success:
      description: Successful response
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    Paginated:
      description: Successful paginated response
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    Error:
      description: Error response
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    ValidationError:
      description: Validation error
      content: { application/json: { schema: { $ref: "#/components/schemas/ValidationResponse" } } }
    Unauthorized:
      description: Authentication required or token invalid
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    Forbidden:
      description: Access denied
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    NotFound:
      description: Resource not found or outside scope
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiResponse" } } }
    Xlsx:
      description: Excel workbook download
      content: { application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } } }
    Pdf:
      description: PDF download
      content: { application/pdf: { schema: { type: string, format: binary } } }

security:
  - bearerAuth: []
