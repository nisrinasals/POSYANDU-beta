          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: File PDF
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /rujukan/{id}:
    get:
      tags:
        - Rujukan
      summary: Get referral by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiSuccess"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /screening-config:
    get:
      tags:
        - Screening Config
      summary: Get screening configuration
      description: Requires a JWT user with role dinkesAdmin or sa. Returns all stored keys, each with its JSONB value.
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningConfigGetResponse"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Gagal mengambil konfigurasi screening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
      parameters: []
  /screening-config/{id}:
    put:
      tags:
        - Screening Config
      summary: Update screening configuration
      description: Requires a JWT user with role dinkesAdmin or sa. The body property must match the key belonging to the path ID.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreeningConfigRequest"
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScreeningConfigUpdateResponse"
        "400":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Konfigurasi screening tidak ditemukan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "500":
          description: Gagal memperbarui konfigurasi screening
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters: {}
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          additionalProperties: true
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
    RegisterRequest:
      type: object
      required:
        - role
        - email
        - password
        - nama_lengkap
      properties:
        role:
          type: string
          enum:
            - kader
            - puskesmas
            - dinkes
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 72
        nama_lengkap:
          type: string
          minLength: 2
          maxLength: 100
        telepon:
          type: string
          maxLength: 20
        nik:
          type: string
          pattern: ^\d{16}$
        puskesmas_id:
          type: integer
          minimum: 1
        posyandu_id:
          type: integer
          minimum: 1
    OtpRequest:
      type: object
      required:
        - email
        - otp_code
        - purpose
      properties:
        email:
          type: string
          format: email
        otp_code:
          type: string
          pattern: ^\d{6}$
        purpose:
          type: string
          enum:
            - register
            - reset_password
    ResendOtpRequest:
      type: object
      required:
        - email
        - purpose
      properties:
        email:
          type: string
          format: email
        purpose:
          type: string
          enum:
            - register
            - reset_password
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      required:
        - email
        - otp_code
        - new_password
      properties:
        email:
          type: string
          format: email
        otp_code:
          type: string
          pattern: ^\d{6}$
        new_password:
          type: string
          minLength: 8
          maxLength: 72
    WargaRequest:
      type: object
      required:
        - nik
        - nama_lengkap
        - jenis_kelamin
        - tanggal_lahir
      properties:
        nik:
          type: string
          pattern: ^\d{16}$
        nama_lengkap:
          type: string
          minLength: 2
          maxLength: 100
        jenis_kelamin:
          type: string
          enum:
            - L
            - P
        tanggal_lahir:
          type: string
          format: date
        alamat:
          type: string
          maxLength: 500
        rt:
          type: string
          maxLength: 5
        rw:
          type: string
          maxLength: 5
        telepon:
          type: string
          maxLength: 20
        nama_ibu:
          type: string
          maxLength: 100
        nama_ayah:
          type: string
          maxLength: 100
        status_perkawinan:
          type: string
          enum:
            - menikah
            - tidak_menikah
        pekerjaan:
          type: string
          maxLength: 50
        pekerjaan_lainnya:
          type: string
          maxLength: 100
        posyandu_id:
          type: integer
          minimum: 1
        bb_lahir_kg:
          type: number
          minimum: 0
          maximum: 99.99
        tb_lahir_cm:
          type: number
          minimum: 0
          maximum: 999.99
        status_domisili:
          type: string
          enum:
            - aktif
            - pindah
            - meninggal
        profil_kesehatan:
          type: object
        profil_kesehatan_warga:
          type: object
        kategori_sasaran:
          type: string
          enum:
            - bumil
            - busui
            - bayi
            - balita
            - apras
            - uskrem_6_14
            - uskrem_15_18
            - dewasa
            - lansia
          description: Opsional; digunakan untuk validasi kategori terhadap usia/profil, bukan disimpan sebagai atribut warga.
    StatusDomisiliRequest:
      type: object
      required:
        - status_domisili
      properties:
        status_domisili:
          type: string
          enum:
            - aktif
            - pindah
            - meninggal
    MutasiVerifyRequest:
      type: object
      required:
        - nik
        - nama_lengkap
        - nama_ibu
      properties:
        nik:
          type: string
          pattern: ^\d{16}$
        nama_lengkap:
          type: string
          minLength: 2
          maxLength: 100
        nama_ibu:
          type: string
          minLength: 2
          maxLength: 100
    MutasiConfirmRequest:
      type: object
      required:
        - warga_id
        - nik
        - nama_lengkap
        - nama_ibu
      properties:
        warga_id:
          type: integer
          minimum: 1
        nik:
          type: string
          pattern: ^\d{16}$
        nama_lengkap:
          type: string
          minLength: 2
          maxLength: 100
        nama_ibu:
          type: string
          minLength: 2
          maxLength: 100
    ImunisasiRequest:
      type: object
      required:
        - warga_id
        - jenis_imunisasi
        - tanggal_imunisasi
      properties:
        warga_id:
          type: integer
          minimum: 1
        jenis_imunisasi:
          type: string
          maxLength: 100
        tanggal_imunisasi:
          type: string
          format: date
    ImunisasiUpdateRequest:
      type: object
      properties:
        jenis_imunisasi:
          type: string
          maxLength: 100
        tanggal_imunisasi:
          type: string
          format: date
    SesiCreateRequest:
      type: object
      required:
        - posyandu_id
        - tanggal_pelaksanaan
        - lokasi
        - rw
        - status
      properties:
        posyandu_id:
          type: integer
          minimum: 1
        tanggal_pelaksanaan:
          type: string
          format: date
        lokasi:
          type: string
          maxLength: 255
        rw:
          type: string
          maxLength: 5
        status:
          type: string
          enum:
            - open
            - closed
    SesiUpdateRequest:
      type: object
      properties:
        posyandu_id:
          type: integer
          minimum: 1
        tanggal_pelaksanaan:
          type: string
          format: date
        lokasi:
          type: string
          maxLength: 255
        rw:
          type: string
          maxLength: 5
        status:
          type: string
          enum:
            - open
            - closed
    SesiStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - open
            - closed
    ProfileUpdateRequest:
      type: object
      properties:
        nama_lengkap:
          type: string
          minLength: 2
          maxLength: 100
        telepon:
          type: string
          maxLength: 20
        nik:
          type: string
          pattern: ^\d{16}$
    UserRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - kader
            - puskesmas
            - puskesmasAdmin
            - dinkes
            - dinkesAdmin
            - sa
    UserStatusRequest:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - pending_approval
            - rejected
            - active
            - inactive
    PregnancyRequest:
      type: object
      properties:
        warga_id:
          type: integer
          minimum: 1
        nama_suami:
          type: string
          maxLength: 100
          nullable: true
        hpht:
          type: string
          format: date
          nullable: true
        hpl:
          type: string
          format: date
          nullable: true
        tanggal_persalinan:
          type: string
          format: date
          nullable: true
        anak_ke:
          type: integer
          minimum: 1
          nullable: true
        jarak_anak_sebelum_bulan:
          type: integer
          minimum: 0
          nullable: true
        cara_persalinan:
          type: string
          enum:
            - normal
            - dengan_tindakan
          nullable: true
        status_kehamilan:
          type: string
          enum:
            - hamil
            - nifas
            - menyusui
            - selesai
        is_menyusui:
          type: boolean
    PregnancyStatusRequest:
      type: object
      required:
        - status_kehamilan
      properties:
        status_kehamilan:
          type: string
          enum:
            - hamil
            - nifas
            - menyusui
            - selesai
        is_menyusui:
          type: boolean
        tanggal_persalinan:
          type: string
          format: date
          nullable: true
    KunjunganCreateRequest:
      type: object
      required:
        - warga_id
        - sesi_posyandu_id
      properties:
        warga_id:
          type: integer
          minimum: 1
        sesi_posyandu_id:
          type: integer
          minimum: 1
    StatusLangkahRequest:
      type: object
      required:
        - status_langkah
      properties:
        status_langkah:
          type: string
          enum:
            - langkah_1
            - langkah_2
            - langkah_3
            - langkah_4
            - langkah_5
    PemeriksaanRequest:
      type: object
      required:
        - kunjungan_id
      properties:
        kunjungan_id:
          type: integer
          minimum: 1
        kategori_sasaran:
          type: string
          enum:
            - bumil
            - busui
            - bayi
            - balita
            - apras
            - uskrem_6_14
            - uskrem_15_18
            - dewasa
            - lansia
        tanggal:
          type: string
          format: date
        bb_kg:
          type: number
          minimum: 0.01
          maximum: 999.99
        tb_cm:
          type: number
          minimum: 0.01
          maximum: 999.99
        lingkar_kepala_cm:
          type: number
          minimum: 0.01
          maximum: 99.99
        lila_cm:
          type: number
          minimum: 0.01
          maximum: 99.99
        lingkar_perut_cm:
          type: number
          minimum: 0.01
          maximum: 999.99
        td_sistole:
          type: number
          minimum: 1
          maximum: 300
        td_diastole:
          type: number
          minimum: 1
          maximum: 300
        kadar_gula:
          type: number
          minimum: 0
          maximum: 9999
        detail_skrining:
          type: object
        is_skrining_tahunan:
          type: boolean
        profile_kehamilan_id:
          type: integer
          minimum: 1
          nullable: true
        topik_penyuluhan:
          type: string
          maxLength: 500
          nullable: true
        is_perlu_rujukan:
          type: boolean
        alasan_rujukan:
          type: string
          maxLength: 1000
          nullable: true
        status_kehadiran_rujukan:
          type: string
          enum:
            - hadir
            - tidak_hadir
          nullable: true
    ScreeningConfigRequest:
      type: object
      minProperties: 1
      properties:
        asi_eksklusif_months:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
        mpasi_min_age_months:
          type: integer
          minimum: 0
        mpasi_max_age_months:
          type: integer
          minimum: 0
        vitamin_a_months:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
        obat_cacing_months:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
    ScreeningConfigGetResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          additionalProperties:
            type: object
            required: [value]
            properties:
              value:
                oneOf:
                  - type: array
                    items: { type: integer }
                  - type: integer
                  - type: number
                  - type: string
                  - type: boolean
                  - type: object
    ScreeningConfigUpdateResponse:
      type: object
      required: [success, message]
      properties:
        success:
          type: boolean
          enum: [true]
        message:
          type: string
          enum: [Konfigurasi screening berhasil diperbarui]
    ProfilePictureRequest:
      type: object
      required:
        - profile_picture
      properties:
        profile_picture:
          type: string
          format: binary
